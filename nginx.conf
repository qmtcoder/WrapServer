server {
    listen 8888;
    listen [::]:8888;
    server_name _;

    client_max_body_size 50m;

    access_log /var/log/nginx/webwrap.access.log;
    error_log /var/log/nginx/webwrap.error.log warn;

    # Backend API → Node :3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Game project proxy
    location /game/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # Frontend SPA under /webwrap/
    location /webwrap/ {
        alias /var/www/WebWrap/dist/;
        index index.html;
        try_files $uri $uri/ @webwrap_fallback;
    }

    location @webwrap_fallback {
        rewrite ^ /webwrap/index.html last;
    }

    location = /webwrap {
        return 301 /webwrap/;
    }

    location = / {
        return 302 /webwrap/;
    }
}
